Identifier: eos55vx
Slug: cocograph-formula
Status: In progress
Title: CoCoGraph Formula-Preserving Generation
Description: Given a molecule, generates alternative chemically valid structures
  sharing its exact atomic composition (molecular formula), via a constrained 
  graph diffusion process that guarantees 100% validity by design. Useful for 
  exploring new isomers and analogues within a fixed elemental composition, 
  producing molecules whose physicochemical property distributions closely match
  real, drug-like chemical space.
