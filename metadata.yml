Identifier: eos55vx
Slug: cocograph-formula
Status: In progress
Title: CoCoGraph Formula-Preserving Generation
Description: Generates 100 new, chemically valid molecules that share the exact 
  atomic composition of an input compound, using a constrained graph diffusion 
  process trained on 2.25 million molecules from PubChem, ChEMBL, ZINC and NIST.
  Validity is guaranteed by design rather than learned, since every diffusion 
  step swaps bonds while preserving atom valences. In a blind test, 121 organic 
  chemistry experts correctly distinguished generated from real molecules only 
  62% of the time. Training and inference are restricted to molecules of 5-70 
  total atoms, hydrogens included.
